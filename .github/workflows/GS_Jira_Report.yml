name: Generate Jira Metrics Report

on:
  schedule:
    - cron: '0 18 * * 5' # Runs at 18:00 every Friday (UTC)
  workflow_dispatch:     # Allows you to trigger the run manually from the UI

jobs:
  run-jira-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl
          
      - name: Run Jira Report Script
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python GS_jira_ticket_report_github.py
        
      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: GS_jira_year_report
          path: GS_jira_year_report.xlsx
          retention-days: 7
