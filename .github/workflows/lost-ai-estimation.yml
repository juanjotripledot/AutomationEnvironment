name: LOST AI Estimation

# Schedule notes
# ---------------
# Cron is evaluated in UTC. The user-facing requirement is "Sun + Tue 08:00 Europe/Madrid".
# Madrid is CEST (UTC+2) from late March to late October, and CET (UTC+1) the rest of the year.
# This workflow uses 06:00 UTC which equals 08:00 Madrid local time during CEST (most of the year).
# During CET it will fire at 07:00 Madrid local. That trade-off is intentional — GitHub Actions
# cron has no DST handling. To always hit 08:00 Madrid local, switch to a self-hosted runner with
# its own timezone, or adjust the cron twice a year.

on:
  schedule:
    - cron: '0 6 * * 0,2'   # Sun + Tue 06:00 UTC (= 08:00 Madrid CEST / 07:00 CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Jira writes, no Slack post)'
        type: boolean
        default: false
      estimate_only:
        description: 'Skip the accuracy compare + Slack step (estimate only)'
        type: boolean
        default: false

permissions:
  contents: write   # so the job can commit /reports/*.csv back to the branch

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/lost_estimation/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/lost_estimation/requirements.txt

      - name: Estimate empty-SP tickets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_EMAIL:        ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:    ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL:     https://tripledotstudios.atlassian.net
          JIRA_PROJECT:      LOST
          AI_SP_FIELD:       customfield_13643
          HUMAN_SP_FIELD:    customfield_10023
          DRY_RUN:           ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/lost_estimation/estimate.py

      - name: Generate AI vs human accuracy report
        if: ${{ github.event.inputs.estimate_only != 'true' }}
        env:
          JIRA_EMAIL:        ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:    ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL:     https://tripledotstudios.atlassian.net
          JIRA_PROJECT:      LOST
          AI_SP_FIELD:       customfield_13643
          HUMAN_SP_FIELD:    customfield_10023
          IN_PROGRESS_FIELD: customfield_10362
          VERIFIED_FIELD:    customfield_10388
        run: python scripts/lost_estimation/compare.py

      - name: Post Slack digest
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.estimate_only != 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/lost_estimation/slack_digest.py

      - name: Commit reports
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "lost-ai-estimation-bot"
          git config user.email "lost-ai-estimation@tripledotstudios.com"
          git add scripts/lost_estimation/reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "AI estimation run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new reports to commit."
          fi

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-ai-estimation-${{ github.run_id }}
          path: scripts/lost_estimation/reports/runs/
          retention-days: 30
